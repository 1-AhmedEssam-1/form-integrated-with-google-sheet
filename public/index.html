<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="form-card">

            <div class="purple-line"></div>

            <h1>Booking Form</h1>
            <p>Please fill in the information below.</p>

            <form id="bookingForm">

                <label>Tb3</label>
                <input type="text" id="tb3" list="tb3Options" placeholder="Choose or write name" required>

                <datalist id="tb3Options">
                    <option value="Ahmed">
                    <option value="Mohamed">
                    <option value="Nancy">
                    <option value="Lamia">
                    <option value="Disha">
                </datalist>
                <label>Phone Number</label>
                <input type="tel" id="phone" placeholder="010xxxxxxxx">
                <label>Name</label>
                <input type="text" id="name" placeholder="Enter the name ">
                <label>t7seel</label>
                <textarea id="t7seel" rows="4" placeholder="Write any notes..."></textarea>


                <label>no of nights</label>
                <input type="number" id="nights" required>



                <label>no of rooms</label>
                <input type="number" id="rooms" required>





                <label>Booking Date</label>
                <input type="date" id="date1" required>




                <label>Notes</label>
                <textarea id="notes" rows="4" placeholder="Write any notes..."></textarea>

                <button type="submit"  id="submitBtn">
                    Submit
                </button>
                <button type="button" id="cancelEditBtn" style="display:none;">
                    Cancel
                </button>

            </form>

        </div>


        <div class="table-card">

            <h2>Today's Bookings</h2>
            <input type="text" id="searchInput" placeholder="Search the whole sheet by client name or phone or tb3">
            <label>Search by date</label>

            <input type="date" id="searchDate">
            <table>

                <thead>

                    <tr>
                        <th>Tb3</th>
                        <th>Phone</th>
                        <th>Name</th>
                        <th>t7seel</th>
                        <th>no of nights</th>
                        <th>tfaseel</th>

                        <th>no of rooms</th>
                        <th>Date</th>
                        <th>Date of registration</th>
                        <th>Actions</th>


                    </tr>

                </thead>

                <tbody id="bookingTable">

                </tbody>

            </table>

        </div>

    </div>

    <div id="detailsModal" class="modal">

        <div class="modal-content">

            <span id="closeModal">✖</span>

            <h2>Booking Details</h2>

            <div id="bookingDetails"></div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
