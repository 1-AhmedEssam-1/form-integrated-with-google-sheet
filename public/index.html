<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking System</title>


    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="form-card">

            <div class="purple-line"></div>

            <h1>Booking Form</h1>
            <p>Please fill in the information below.</p>
            <button id="themeToggle" class="theme-btn">🌙</button>

            <form id="bookingForm" dir="rtl">

                <label>تبع</label>
                <input type="text" id="tb3" required>
                <label> رقم التليفون</label>
                <input type="tel" id="phone" placeholder="010xxxxxxxx">
                <label>الاسم</label>
                <input type="text" id="name" placeholder="اكتب اسم">
                <label>التحصيل</label>
                <textarea id="t7seel" rows="4" placeholder="التحصيل"></textarea>


                <label>عدد الليالي</label>
                <input type="number" id="nights" required>



                <label>عدد الغرف</label>
                <input type="number" id="rooms" required>





                <label>تاريخ الحجز</label>
                <input type="date" id="date1" required>




                <label>التفاصيل</label>
                <textarea id="notes" rows="4" placeholder="التفاصيل"></textarea>

                <button type="submit" id="submitBtn">
                    Submit
                </button>
                <button type="button" id="cancelEditBtn" style="display:none;">
                    Cancel
                </button>

            </form>

        </div>


        <div class="table-card">

            <!-- <h2>Today's Bookings</h2> -->
            <div class="table-header">

                <h2>
                    Today's Bookings
                    (<span id="bookingCount"></span>)
                </h2>

                <button id="downloadReportBtn" class="download-btn">
                    📥 Download Image
                </button>

                <button id="downloadPdfBtn" class="download-btn">
                    📄 Download PDF
                </button>

            </div>
            <input type="text" id="searchInput" placeholder="Search the whole sheet by client name or phone or tb3">
            <label>Search by date</label>

            <input type="date" id="searchDate">
            <button id="showColumnsBtn" class="download-btn">
                👁 Show All
            </button>
            <table>

                <thead>

                    <tr>
                        <thead>
                            <tr>
                                <th>تبع <button class="hide-column-btn" onclick="hideColumn(1)">👁</button></th>

                                <th>رقم التليفون <button class="hide-column-btn" onclick="hideColumn(2)">👁</button>
                                </th>

                                <th>الاسم <button class="hide-column-btn" onclick="hideColumn(3)">👁</button></th>

                                <th>التحصيل <button class="hide-column-btn" onclick="hideColumn(4)">👁</button></th>

                                <th>عدد الليالي <button class="hide-column-btn" onclick="hideColumn(5)">👁</button></th>

                                <th>التفاصيل <button class="hide-column-btn" onclick="hideColumn(6)">👁</button></th>

                                <th>عدد الغرف <button class="hide-column-btn" onclick="hideColumn(7)">👁</button></th>

                                <th>التاريخ <button class="hide-column-btn" onclick="hideColumn(8)">👁</button></th>

                                <th>تاريخ الارسال <button class="hide-column-btn" onclick="hideColumn(9)">👁</button>
                                </th>

                                <th>Actions</th>
                            </tr>
                        </thead>


                    </tr>

                </thead>

                <tbody id="bookingTable">

                </tbody>

            </table>

        </div>

    </div>

    <div id="detailsModal" class="modal">

        <div class="modal-content">

            <span id="closeModal">✖</span>

            <h2>Booking Details</h2>

            <div id="bookingDetails"></div>

        </div>

    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <div id="colorModal" class="color-modal">

        <div class="color-box green" onclick="setRowColor('green')"></div>

        <div class="color-box yellow" onclick="setRowColor('yellow')"></div>

        <div class="color-box red" onclick="setRowColor('red')"></div>

        <div class="color-box blue" onclick="setRowColor('blue')"></div>

        <button id="close" class="color-box clear" onclick="setRowColor('')">
            ✖
        </button>

    </div>
    <script src="script.js"></script>


</body>

</html>
